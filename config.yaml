
# faster-whisper transcriber defaults — all can be overridden via CLI args

model: "Systran/faster-distil-whisper-large-v3"   # English-only, distilled, 6× faster
device: "cuda"              # cuda | cpu
compute_type: "float16"     # float16 (GPU) | int8_float16 (low VRAM) | int8 (CPU)
language: "en"              # distil-large-v3 is English-only
return_timestamps: true     # true = timestamped segments, false = plain text

# keep audio files downloaded during Whisper fallback
keep_audio: false

# transcript storage — at least one must be true
save_local: true        # save .txt files to ./channels/{channel}/transcripts/
send_telegram: false    # upload transcripts to Telegram channel (requires env vars)

# blog generation
llm:
  base_url: "https://api.groq.com/openai/v1"   # Groq (OpenAI-compatible); key in .env as LLM_API_KEY
  api_key_env: "GROQ_API_KEY"           
  model: "llama-3.3-70b-versatile"              # Groq, 128k context
  temperature: 0.7
